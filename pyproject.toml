[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-core"
version = "0.5.0"
description = "Autonomous Compositional Evolution (ACE) Neurosymbolic Research & Verification Framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "dianzherdiana25-hash" }
]
keywords = [
    "program-synthesis",
    "neurosymbolic",
    "formal-methods",
    "smt-solver",
    "craig-interpolation",
    "abstract-interpretation",
    "e-graphs",
    "sygus",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ace = "ace_runtime.cli:main"
ace-autonomy = "ace_autonomy.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code"]
python_files = ["test_*.py"]
pythonpath = ["code", "."]
