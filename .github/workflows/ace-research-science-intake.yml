name: ACE coordinator research science intake

on:
  push:
    branches:
      - coordination/research-science-intake-20261105
  pull_request:
    paths:
      - 'tools/ace_research_intake_screen.py'
      - 'tools/test_ace_research_intake_screen.py'
      - 'docs/ACE_RESEARCH_INTAKE_PRESCORE_V1.md'
      - '.github/workflows/ace-research-science-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-independent-public-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout coordinator exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout R1 exact pinned source without modifying research branch
        uses: actions/checkout@v4
        with:
          repository: dianzherdiana25-hash/ACE
          ref: cf8948144919d41a70d1da6f3fb289d1dc818e36
          path: _lane/r1
          persist-credentials: false
      - name: Prove source custody and immutable coordinator prescore
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git -C _lane/r1 rev-parse HEAD)" = "cf8948144919d41a70d1da6f3fb289d1dc818e36"
          git show b8d9c1123933f7cb21ea832cc2a58c24505eca65:docs/ACE_RESEARCH_INTAKE_PRESCORE_V1.md > /tmp/ace-intake-prescore.md
          cmp /tmp/ace-intake-prescore.md docs/ACE_RESEARCH_INTAKE_PRESCORE_V1.md
          echo "R1 exact pinned SHA and pre-score lock verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Run coordinator independent R1 task generator and controls
        env:
          PYTHONPATH: _lane/r1/code:.
        run: |
          set -euo pipefail
          python -m unittest tools.test_ace_research_intake_screen -v
          mkdir -p _intake
          python tools/ace_research_intake_screen.py --output _intake/r1_new_tasks.json > _intake/r1_summary.json
          python tools/ace_research_intake_screen.py --output _intake/r1_replay.json > _intake/r1_replay_summary.json
          cmp _intake/r1_new_tasks.json _intake/r1_replay.json
          sha256sum _intake/r1_new_tasks.json
          cat _intake/r1_summary.json
      - name: Preserve public source and negative-evidence receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-r1-independent-public-intake
          path: |
            _intake/r1_new_tasks.json
            _intake/r1_summary.json
          if-no-files-found: warn

  r8-public-null-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout coordinator exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout R8 pinned exact source
        uses: actions/checkout@v4
        with:
          repository: dianzherdiana25-hash/ACE
          ref: 9fa4cb8ec3896ea157ad135d75d241da3a4cb6c1
          path: _lane/r8
          persist-credentials: false
      - name: Verify frozen source HEADs
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git -C _lane/r8 rev-parse HEAD)" = "9fa4cb8ec3896ea157ad135d75d241da3a4cb6c1"
      - name: Reproduce R8 public null false-progress canary
        env:
          PYTHONPATH: _lane/r8/code:.
        run: |
          set -euo pipefail
          python -m unittest ace_research_measurement.test_measurement ace_research_measurement.test_e15_audit ace_research_measurement.test_selection_bias ace_research_measurement.test_lineage ace_research_measurement.test_growth_gate ace_research_measurement.test_growth_falsifiers -v
          mkdir -p _intake
          python -m ace_research_measurement.growth_falsifiers --output _intake/r8_growth_null.json
          cmp _intake/r8_growth_null.json _lane/r8/code/ace_research_measurement/results_growth_null.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('_intake/r8_growth_null.json').read_text())
          assert report['design']['known_true_delta'] == 0
          assert report['counts'] == {'naive_delta_at_least_10pp':42, 'public_screen_pass':9}
          assert report['claim'] == 'PUBLIC_NULL_DIAGNOSTIC_ONLY_NO_REAL_ACE'
          print('R8 null confirmed: 42/512 naive false progress, 9/512 diagnostic false passes')
          PY
          sha256sum _intake/r8_growth_null.json
      - name: Preserve measurement-canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-r8-public-null-intake
          path: _intake/r8_growth_null.json
          if-no-files-found: warn

  r1-h7-independent-class-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Coordinator exact-head checkout with prescore commit ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: R1 H7 exact frozen study source
        uses: actions/checkout@v4
        with:
          repository: dianzherdiana25-hash/ACE
          ref: 8952c8ac55613e61b362841f4722c66a5aa990b3
          path: _lane/h7
          persist-credentials: false
      - name: Verify prescore lock and exact third-party source
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git -C _lane/h7 rev-parse HEAD)" = "8952c8ac55613e61b362841f4722c66a5aa990b3"
          git show e4280bb3ebf4372a4ee69834e55dd0c8085b68b6:docs/ACE_RESEARCH_INTAKE_H7_PRESCORE_V1.md > /tmp/ace-coordinator-h7-prescore.md
          cmp /tmp/ace-coordinator-h7-prescore.md docs/ACE_RESEARCH_INTAKE_H7_PRESCORE_V1.md
          echo "Coordinator H7 protocol timestamp, source SHA and checkout verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute independent H7 new-length balanced error study
        env:
          PYTHONPATH: _lane/h7/code:.
        run: |
          set -euo pipefail
          python -m unittest ace_research_primitives.test_h6_distinguish ace_research_primitives.test_h7_residual_memory tools.test_ace_research_intake_h7 -v
          mkdir -p _intake
          python tools/ace_research_intake_h7.py --output _intake/h7_new_gram_tasks.json > _intake/h7_summary.json
          python tools/ace_research_intake_h7.py --output _intake/h7_replay.json > _intake/h7_replay_summary.json
          cmp _intake/h7_new_gram_tasks.json _intake/h7_replay.json
          sha256sum _intake/h7_new_gram_tasks.json
          cat _intake/h7_summary.json
      - name: Preserve independent H7 scientific evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-r1-h7-independent-crossclass
          path: |
            _intake/h7_new_gram_tasks.json
            _intake/h7_summary.json
          if-no-files-found: warn

  coordinator-science-admission:
    name: fail-closed science admission (not a release approval)
    needs: [r1-independent-public-transfer, r8-public-null-canary, r1-h7-independent-class-transfer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exact HEAD coordinator code checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve H7 independent raw terminal evidence
        uses: actions/download-artifact@v4
        with:
          name: ace-r1-h7-independent-crossclass
          path: _intake_h7
      - name: Retrieve R1 high-state negative-evidence receipt
        uses: actions/download-artifact@v4
        with:
          name: ace-r1-independent-public-intake
          path: _intake_r1
      - name: Retrieve R8 known-zero-effect false-progress canary
        uses: actions/download-artifact@v4
        with:
          name: ace-r8-public-null-intake
          path: _intake_r8
      - name: Assert independent scores and fail-closed promotion policy
        env:
          ACE_H7_EVIDENCE: _intake_h7/h7_new_gram_tasks.json
          ACE_R1_EVIDENCE: _intake_r1/r1_new_tasks.json
          ACE_R8_EVIDENCE: _intake_r8/r8_growth_null.json
        run: |
          set -euo pipefail
          python -m unittest tools.test_ace_science_release_gate -v
          mkdir -p _release
          python tools/ace_science_release_gate.py \
            --h7 "$ACE_H7_EVIDENCE" \
            --r1 "$ACE_R1_EVIDENCE" \
            --r8 "$ACE_R8_EVIDENCE" > _release/science_admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('_release/science_admission.json').read_text())
          assert r['engineering_evidence']=='PASS_INDEPENDENT_PUBLIC_REPLAY'
          assert r['promotion_decision']=='BLOCK_RELEASE'
          assert r['scientific_decision']=='NOT_ASSESSED'
          assert r['r8_null_diagnostic']=='NONZERO_FALSE_PASSES_9_OF_512'
          assert r['h7']['h7_terminal_predictions_recomputed']==12288
          print('SCIENCE_INTEGRITY_VERIFIED: YES; RELEASE_ALLOWED: NO')
          PY
          cat _release/science_admission.json
      - name: Preserve science admission report without allowing promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-science-admission-hold
          path: _release/science_admission.json
          if-no-files-found: warn
