name: ACE research verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify imported source bytes
        run: python tools/verify_sources.py
      - name: Test research modules and negative controls
        run: >-
          python -m unittest
          ace_research_primitives.test_primitive_discovery
          ace_candidate_search.test_search
          ace_candidate_search.test_verify_results
          ace_capability_evolution.test_pilot
          ace_capability_evolution.test_structural
          ace_capability_evolution.test_compositional
          ace_runtime.test_engine
          ace_runtime.test_cli
          ace_research_repair.test_repair
          ace_research_repair.test_repair_sandbox
          ace_research_hypgen.test_hypgen
          ace_research_agenda.test_agenda
          ace_research_agenda.test_durable_resume
          ace_research_generations.test_generations
          ace_research_generations.test_generations_growth
          ace_host_controller.test_host_controller
          ace_host_controller.test_boundary_penetration
          ace_host_controller.test_evaluator_v2
          ace_research_f12.test_f12_research
          ace_research_f13.test_f13_memory
          ace_research_f14.test_f14_discovery
          -v
      - name: Verify immutable repair v1 custody and pinned public v2 replay
        run: |
          python -m unittest tools.test_verify_repair_v2 -v
          python tools/repair_v2_probe.py --output "$RUNNER_TEMP/ace-repair-v2.json.gz"
          python tools/verify_repair_v2.py --candidate "$RUNNER_TEMP/ace-repair-v2.json.gz"
      - name: Verify hypothesis synthesis evidence artifact
        run: python -m ace_research_hypgen.verify --artifact evidence/hypgen/f10_hypothesis_synthesis_v1.json.gz
      - name: Verify generations growth evidence artifact
        run: python -m ace_research_generations.verify_growth --artifact evidence/generations/ace_generations_growth_v1.json.gz
      - name: Verify F12 causal research evidence artifact
        run: python -m ace_research_f12.verify --artifact evidence/f12/ace_f12_causal_research_v1.json.gz
      - name: Verify F13 causal memory evidence artifact
        run: python -m ace_research_f13.verify --artifact evidence/f13/ace_f13_causal_memory_v1.json.gz
      - name: Verify F14 mechanism discovery evidence artifact
        run: python -m ace_research_f14.verify --artifact evidence/f14/ace_f14_mechanism_discovery_v1.json.gz
      - name: Run unified F13 and F14 external verifier
        run: python tools/verify_f13_f14.py
      - name: Verify deterministic composition replay
        run: |

          python -m ace_capability_evolution.compositional --output /tmp/composition.json
          python -m ace_capability_evolution.compositional --output /tmp/composition-replay.json
          cmp /tmp/composition.json /tmp/composition-replay.json
          gzip -dc evidence/composition/v03.json.gz > /tmp/committed-composition.json
          cmp /tmp/composition.json /tmp/committed-composition.json
      - name: Verify immutable runtime v1 custody and exact public v2 replay
        run: |
          python -m unittest tools.test_verify_runtime_demo_v2 -v
          python ace.py demo --workspace "$RUNNER_TEMP/ace-runtime-v2-a" > "$RUNNER_TEMP/ace-runtime-v2-a.json"
          python ace.py demo --workspace "$RUNNER_TEMP/ace-runtime-v2-b" > "$RUNNER_TEMP/ace-runtime-v2-b.json"
          cmp "$RUNNER_TEMP/ace-runtime-v2-a.json" "$RUNNER_TEMP/ace-runtime-v2-b.json"
          python tools/verify_runtime_demo_v2.py --candidate "$RUNNER_TEMP/ace-runtime-v2-a.json" --expected evidence/runtime/v2-demo.json
