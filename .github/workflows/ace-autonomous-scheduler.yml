name: ACE Autonomous Research Scheduler V0.2

on:
  workflow_dispatch:
    inputs:
      max_cycles:
        description: 'Maximum autonomous cycles to execute in this run (1-5)'
        required: false
        default: '3'
      force_unlock:
        description: 'Force release expired concurrency lock'
        required: false
        default: 'false'
      author_type:
        description: 'Author provenance identifier'
        required: false
        default: 'ACE_AUTONOMOUS_V02'
  schedule:
    # Run once daily at 00:00 UTC (strictly bounded)
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ace-autonomous-continuity
  cancel-in-progress: false

jobs:
  execute-bounded-autonomous-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
      ACE_SIGNING_KEY: ${{ secrets.ACE_SIGNING_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify source integrity
        run: |
          set -euo pipefail
          python tools/verify_sources.py

      - name: Run unit and continuity test suites
        run: |
          set -euo pipefail
          python -m unittest ace_self_dev.test_self_dev_loop ace_loop.test_source_evolution ace_chat.test_task_runner -v

      - name: Force unlock state if requested
        if: "${{ github.event.inputs.force_unlock == 'true' }}"
        run: |
          python -m ace_self_dev.cli --force-unlock

      - name: Execute Bounded Autonomous Research Cycles
        run: |
          set -euo pipefail
          MAX_CYCLES="${{ github.event.inputs.max_cycles || '3' }}"
          AUTHOR="${{ github.event.inputs.author_type || 'ACE_AUTONOMOUS_V02' }}"
          echo "Running ACE Autonomous Continuity with MAX_CYCLES=${MAX_CYCLES}, AUTHOR=${AUTHOR}..."
          python -m ace_self_dev.cli --continuous "$MAX_CYCLES" --author-type "$AUTHOR"

      - name: Verify Autonomous Continuity & Artifacts
        run: |
          set -euo pipefail
          python tools/verify_self_dev.py

      - name: Archive research state, checkpoints, and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-autonomous-continuity-evidence
          path: |
            checkpoints/self_dev/research_state.json
            checkpoints/self_dev/cycle_*.json
            evidence/self_dev/ace_self_dev_v*.json.gz
          if-no-files-found: warn
          retention-days: 7
