name: ACE R9 Gemini representation transfer

on:
  pull_request:
  push:
    branches: [research/gemini-r9-representation-transfer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r9-reptransfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify imported source bytes
        run: python tools/verify_sources.py
      - name: Test original test suite
        run: >-
          python -m unittest
          ace_research_primitives.test_primitive_discovery
          ace_candidate_search.test_search
          ace_candidate_search.test_verify_results
          ace_capability_evolution.test_pilot
          ace_capability_evolution.test_structural
          ace_capability_evolution.test_compositional
          ace_runtime.test_engine
          ace_runtime.test_cli
          -v
      - name: Test R9 representation transfer unit tests
        run: python -m unittest ace_research_reptransfer.test_reptransfer -v
      - name: Run deterministic R9 experiment twice and compare bytes
        run: |
          python -m ace_research_reptransfer.runner --output /tmp/r9_run1.json
          python -m ace_research_reptransfer.runner --output /tmp/r9_run2.json
          cmp /tmp/r9_run1.json /tmp/r9_run2.json
          python -m ace_research_reptransfer.verify /tmp/r9_run1.json
      - name: Compare with committed evidence
        run: |
          gzip -dc evidence/reptransfer/r9_gemini_v1.json.gz > /tmp/committed_r9.json
          cmp /tmp/r9_run1.json /tmp/committed_r9.json
