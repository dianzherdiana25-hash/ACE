name: ACE repair v2 public candidate and provenance (no promotion)

on:
  pull_request:
    paths:
      - 'code/ace_research_repair/**'
      - 'code/ace_runtime/**'
      - 'code/ace_capability_evolution/**'
      - 'tools/repair_v2_probe.py'
      - 'evidence/repair/**'
      - '.github/workflows/ace-repair-v2-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-v2-public-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact source checkout and immutable public repair v1
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git hash-object evidence/repair/ace_repair_v1.json.gz)" = "5ae098a6f28ba0269d3d650b0704c588ef8f9783"
          git show -s --format="%H %s" HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify upstream source custody
        run: python tools/verify_sources.py
      - name: Generate candidate from clean independent temporary workspaces
        run: |
          python tools/repair_v2_probe.py --output "$RUNNER_TEMP/repair-v2-a.json.gz" | tee "$RUNNER_TEMP/receipt-a.json"
          python tools/repair_v2_probe.py --output "$RUNNER_TEMP/repair-v2-b.json.gz" | tee "$RUNNER_TEMP/receipt-b.json"
          cmp "$RUNNER_TEMP/repair-v2-a.json.gz" "$RUNNER_TEMP/repair-v2-b.json.gz"
          cmp "$RUNNER_TEMP/receipt-a.json" "$RUNNER_TEMP/receipt-b.json"
          python -m unittest tools.test_verify_repair_v2 -v
          python tools/verify_repair_v2.py --candidate "$RUNNER_TEMP/repair-v2-a.json.gz"
          sha256sum "$RUNNER_TEMP/repair-v2-a.json.gz"
          echo "PASS_PUBLIC_REPAIR_V2_REPLAY_NOT_SCIENTIFIC_GO"
      - name: Upload public engineering receipt candidate (not production)
        uses: actions/upload-artifact@v4
        with:
          name: ace-repair-v2-public-candidate
          path: |
            ${{ runner.temp }}/repair-v2-a.json.gz
            ${{ runner.temp }}/receipt-a.json
          if-no-files-found: error
          retention-days: 14
