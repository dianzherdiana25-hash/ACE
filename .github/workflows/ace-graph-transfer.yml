name: ACE Research — graph family transfer and native comparator

on:
  push:
    branches:
      - research/chat-graph-transfer-20261106
  pull_request:
    paths:
      - 'code/ace_research_graph_transfer/**'
      - 'docs/ACE_GRAPH_TRANSFER_*'
      - '.github/workflows/ace-graph-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-family-ood:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact repository checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source pin, chronologically locked prescore, and no ACE mutations
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor aa1bbdafc0cd1c6240e4138bd8b9eec470714a01 HEAD
          git show aa1bbdafc0cd1c6240e4138bd8b9eec470714a01:docs/ACE_GRAPH_TRANSFER_PRESCORE_V1_20261106.md > /tmp/ace-graph-frozen-protocol
          cmp /tmp/ace-graph-frozen-protocol docs/ACE_GRAPH_TRANSFER_PRESCORE_V1_20261106.md
          for src in code/ace_runtime/engine.py code/ace_capability_evolution/compositional.py code/ace_capability_evolution/structural.py code/ace_research_primitives/primitive_discovery.py code/ace_candidate_search/model.py; do
            git show "80104ce50ecbcea21080bed8c0eabce88d47ccb5:$src" > /tmp/ace-source
            cmp /tmp/ace-source "$src"
          done
          python tools/verify_sources.py
      - name: Graph-family exact oracle, admissibility, invariance and adversarial tests
        run: |
          set -euo pipefail
          python -m unittest ace_research_graph_transfer.test_study -v
          python -m unittest ace_runtime.test_engine -v
      - name: Full graph OOD trial, double independent run and strict verification
        run: |
          set -euo pipefail
          mkdir -p _graph_transfer
          python -m ace_research_graph_transfer.study --output _graph_transfer/report.json | tee _graph_transfer/summary.json
          python -m ace_research_graph_transfer.study --output _graph_transfer/report-replay.json > _graph_transfer/summary-replay.json
          cmp _graph_transfer/report.json _graph_transfer/report-replay.json
          python -m ace_research_graph_transfer.verify_evidence _graph_transfer/report.json | tee _graph_transfer/verification.json
          sha256sum _graph_transfer/report.json
      - name: Upload exact graph OOD public receipt and failed controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-graph-family-transfer-public
          path: |
            _graph_transfer/report.json
            _graph_transfer/summary.json
            _graph_transfer/verification.json
          if-no-files-found: warn
          retention-days: 30
