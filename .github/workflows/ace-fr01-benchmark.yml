name: ACE FR01 public retrieval comparison

on:
  pull_request:
    paths:
      - 'tools/ace_fr01_retrieval_benchmark.py'
      - '.github/workflows/ace-fr01-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compare public baseline controls with source cost
        run: |
          python tools/ace_fr01_retrieval_benchmark.py | tee "$RUNNER_TEMP/fr01-benchmark.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/fr01-benchmark.json")); c=d["conditions"]; assert (c["lexical"]["top1_correct"],c["structural"]["top1_correct"],c["hybrid"]["top1_correct"]) == (2,3,3); assert d["external_ai_calls"] == 0 and not d["candidate_source_executed"]; print("FR01 public control validated")'
