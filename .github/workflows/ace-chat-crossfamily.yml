name: ACE Chat — Cross-family Retention and Transfer

on:
  push:
    branches:
      - research/chat-crossfamily-transfer-20261106
  pull_request:
    paths:
      - 'code/ace_research_intake/crossfamily.py'
      - 'code/ace_research_intake/verify_crossfamily.py'
      - 'code/ace_research_intake/test_crossfamily.py'
      - 'docs/ACE_CHAT_CROSSFAMILY_*'
      - '.github/workflows/ace-chat-crossfamily.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossfamily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Lock exact HEAD and preregistered protocol
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor 37706b8b86121f2052de08c14e4f09285830901a HEAD
          git show 37706b8b86121f2052de08c14e4f09285830901a:docs/ACE_CHAT_CROSSFAMILY_PRESCORE_20261106.md >/tmp/locked
          cmp /tmp/locked docs/ACE_CHAT_CROSSFAMILY_PRESCORE_20261106.md
          for item in code/ace_runtime/engine.py code/ace_capability_evolution/compositional.py code/ace_capability_evolution/structural.py code/ace_research_primitives/primitive_discovery.py code/ace_candidate_search/model.py; do
            git show "80104ce50ecbcea21080bed8c0eabce88d47ccb5:$item" >/tmp/original
            cmp /tmp/original "$item"
          done
          python tools/verify_sources.py
      - name: Test retained runtime and negative controls
        run: |
          set -euo pipefail
          python -m unittest ace_research_intake.test_crossfamily -v
          python -m unittest ace_runtime.test_engine -v
      - name: Execute source runtime twice and verify evidence
        run: |
          set -euo pipefail
          mkdir -p _crossfamily
          python -m ace_research_intake.crossfamily --output _crossfamily/report.json | tee _crossfamily/summary.json
          python -m ace_research_intake.crossfamily --output _crossfamily/replay.json > /dev/null
          cmp _crossfamily/report.json _crossfamily/replay.json
          python -m ace_research_intake.verify_crossfamily _crossfamily/report.json | tee _crossfamily/verification.json
          sha256sum _crossfamily/report.json
      - name: Archive all public trials including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-crossfamily-transfer-public
          path: |
            _crossfamily/report.json
            _crossfamily/summary.json
            _crossfamily/verification.json
          if-no-files-found: warn
          retention-days: 30
