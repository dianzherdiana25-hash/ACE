name: ACE internal ChatGPT VM transfer (one-shot)
on:
  push:
    branches:
      - automation/ace-chatgpt-internal-export-20261108
    paths:
      - .github/workflows/ace-chatgpt-internal-export.yml
permissions:
  contents: read
jobs:
  prepare-local-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout from the isolated export branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Fetch all remote refs and prepare verified private archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ace_vm_transfer
          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull-head/*' \
            '+refs/pull/*/merge:refs/remotes/pull-merge/*' \
            '+refs/tags/*:refs/tags/*'
          git fsck --no-reflogs --connectivity-only --no-progress
          git archive --format=tar refs/remotes/origin/main | xz -6 -T2 > _ace_vm_transfer/ACE_main_source.tar.xz
          git bundle create _ace_vm_transfer/ACE_complete_git_history.bundle --all
          git bundle verify _ace_vm_transfer/ACE_complete_git_history.bundle > _ace_vm_transfer/bundle_verify.log 2>&1
          sha256sum _ace_vm_transfer/ACE_main_source.tar.xz _ace_vm_transfer/ACE_complete_git_history.bundle > _ace_vm_transfer/SHA256SUMS
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          main = run("git", "rev-parse", "refs/remotes/origin/main")
          refs = run("git", "for-each-ref", "--format=%(refname)", "refs/remotes/origin", "refs/remotes/pull-head", "refs/remotes/pull-merge", "refs/tags").splitlines()
          report = {
              "schema": "ace.internal.vm.transfer.v1",
              "remote_repo": "dianzherdiana25-hash/ACE",
              "source_main_sha": main,
              "source_tracked_files": len(run("git", "ls-tree", "-r", "--name-only", "refs/remotes/origin/main").splitlines()),
              "remote_branches": sum(r.startswith("refs/remotes/origin/") for r in refs),
              "pr_head_refs": sum(r.startswith("refs/remotes/pull-head/") for r in refs),
              "pr_merge_refs": sum(r.startswith("refs/remotes/pull-merge/") for r in refs),
              "tags": sum(r.startswith("refs/tags/") for r in refs),
              "reachable_commits": int(run("git", "rev-list", "--all", "--count")),
              "export_branch": "automation/ace-chatgpt-internal-export-20261108",
              "remote_mutations_from_export_job": False,
          }
          Path("_ace_vm_transfer/manifest.json").write_text(json.dumps(report, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload private Git archives for authenticated ChatGPT transfer
        uses: actions/upload-artifact@v4
        with:
          name: ace-full-vm-container-transfer
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: |
            _ace_vm_transfer/ACE_main_source.tar.xz
            _ace_vm_transfer/ACE_complete_git_history.bundle
            _ace_vm_transfer/SHA256SUMS
            _ace_vm_transfer/manifest.json
            _ace_vm_transfer/bundle_verify.log
