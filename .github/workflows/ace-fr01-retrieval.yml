name: ACE FR01 bounded repository retrieval

on:
  pull_request:
    paths:
      - 'code/ace_code_agent/repo_retrieval.py'
      - 'code/ace_code_agent/test_repo_retrieval.py'
      - '.github/workflows/ace-fr01-retrieval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test bounded retrieval and security controls
        run: python -m unittest ace_code_agent.test_repo_retrieval -v
      - name: Smoke real ACE repository without executing source
        run: |
          python -m ace_code_agent.repo_retrieval --repo . --query release_lock --limit 3 > "$RUNNER_TEMP/fr01-smoke.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/fr01-smoke.json")); assert d["files_indexed"] > 30 and d["symbols_indexed"] > 50 and d["provider_calls"] == 0 and not d["candidate_code_executed"]; print("FR01 smoke:", d["head"], d["files_indexed"], d["symbols_indexed"])'
