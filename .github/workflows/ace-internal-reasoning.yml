name: ACE bounded internal reasoning (public diagnostic)

on:
  push:
    branches: [research/ace-internal-reasoning-20261110]
  pull_request:
    paths:
      - 'code/ace_cognition/reasoning*.py'
      - 'tools/ace_reasoning*.py'
      - 'evidence/internal_reasoning/**'
      - '.github/workflows/ace-internal-reasoning.yml'

permissions:
  contents: read

jobs:
  reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and preregistration
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git fetch --no-tags origin 183a9fbfe67c26964db630da89f0743ccf435093
          git show 183a9fbfe67c26964db630da89f0743ccf435093:docs/research/ACE_INTERNAL_REASONING_PROTOCOL_20261110.md > /tmp/registered.md
          cmp /tmp/registered.md docs/research/ACE_INTERNAL_REASONING_PROTOCOL_20261110.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify reused source pins and safety/regression tests
        run: |
          python tools/verify_sources.py
          python -m unittest ace_cognition.reasoning_test ace_component_synthesis.test_component_synthesizer -v
      - name: Reproduce public result twice and compare committed cells
        run: |
          python tools/ace_reasoning_benchmark.py --output /tmp/run-a.json --profile /tmp/profile-a.json
          python tools/ace_reasoning_benchmark.py --output /tmp/run-b.json --profile /tmp/profile-b.json
          cmp /tmp/run-a.json /tmp/run-b.json
          cmp /tmp/run-a.json evidence/internal_reasoning/public-v1.json
          python tools/ace_reasoning_audit.py /tmp/run-a.json
      - uses: actions/upload-artifact@v4
        with:
          name: internal-reasoning-public-${{ matrix.python-version }}
          path: |
            /tmp/run-a.json
            /tmp/profile-a.json
          retention-days: 7
