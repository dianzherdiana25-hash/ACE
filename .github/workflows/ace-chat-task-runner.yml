name: ACE Chat Task Runner — bounded GitHub bridge

on:
  push:
    branches:
      - integration/ace-mcp-bridge-20261106
    paths:
      - 'chat_tasks/current.json'
      - 'code/ace_chat/**'
      - '.github/workflows/ace-chat-task-runner.yml'
  pull_request:
    paths:
      - 'chat_tasks/current.json'
      - 'code/ace_chat/**'
      - '.github/workflows/ace-chat-task-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ace-chat-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  execute-bounded-ace-request:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: code
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable triggering SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact trigger SHA and imported learner source bytes
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python tools/verify_sources.py
      - name: Data-envelope and ACE engine regression
        run: |
          python -m unittest ace_chat.test_task_runner ace_runtime.test_engine -v
      - name: Execute source-controlled ACE research/task request
        run: |
          set -euo pipefail
          mkdir -p _ace_chat_evidence
          python -m ace_chat.task_runner \
            --request chat_tasks/current.json \
            --output _ace_chat_evidence/receipt.json \
            --research-output _ace_chat_evidence/research.json | tee _ace_chat_evidence/run-summary.json
          python -m ace_chat.task_runner \
            --request chat_tasks/current.json \
            --output _ace_chat_evidence/replay-receipt.json \
            --research-output _ace_chat_evidence/replay-research.json > _ace_chat_evidence/replay-summary.json
          cmp _ace_chat_evidence/receipt.json _ace_chat_evidence/replay-receipt.json
          if test -e _ace_chat_evidence/research.json; then
            cmp _ace_chat_evidence/research.json _ace_chat_evidence/replay-research.json
          fi
          sha256sum _ace_chat_evidence/receipt.json
          echo 'ACE task request processed at exact GitHub SHA. This is public development evidence, not scientific GO.' >> "$GITHUB_STEP_SUMMARY"
          cat _ace_chat_evidence/run-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Archive receipts for ChatGPT inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-chat-task-receipts
          path: |
            _ace_chat_evidence/receipt.json
            _ace_chat_evidence/run-summary.json
            _ace_chat_evidence/research.json
          if-no-files-found: warn
          retention-days: 7
